<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071426">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Volt Guardian">
<title>Volt Guardian: Power Run</title>
<style>
:root{--navy:#071426;--blue:#31c8ff;--gold:#f7c948;--white:#f5f8ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--navy);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--white);touch-action:manipulation}body{display:flex;align-items:center;justify-content:center}#wrap{position:relative;width:100%;height:100%;max-width:900px;background:linear-gradient(#071426,#0b2140);overflow:hidden}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:7px;pointer-events:none}.pill{background:#071426d9;border:1px solid #31c8ff70;border-radius:12px;padding:7px 10px;font-weight:800;font-size:13px}.pill small{display:block;color:#a8c5dd;font-size:9px;letter-spacing:.14em}#brand{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#b5c6d9;font-size:10px;letter-spacing:.2em;pointer-events:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#0614268c;text-align:center}.panel{width:min(100%,420px);padding:26px 22px;border:1px solid #31c8ff80;border-radius:24px;background:linear-gradient(145deg,#0b2342f5,#071426f5);box-shadow:0 0 45px #31c8ff20}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.2em;font-size:11px}h1{font-size:clamp(32px,9vw,48px);line-height:.95;margin:12px 0;letter-spacing:-.04em}h1 span{color:var(--blue)}p{color:#c4d5e7;line-height:1.5;font-size:14px;margin:12px 0 20px}button{border:0;border-radius:14px;padding:15px 22px;width:100%;font-size:16px;font-weight:900;letter-spacing:.05em;color:#061426;background:linear-gradient(90deg,#f7c948,#ffe89a);box-shadow:0 5px 0 #b78b1c;cursor:pointer}button:active{transform:translateY(2px)}#hint{font-size:11px;color:#8eabc5;margin-top:14px}.hidden{display:none!important}#jump{position:absolute;right:18px;bottom:40px;width:92px;height:92px;border-radius:50%;border:2px solid #8fe4ff;background:#0b2b49dd;color:white;box-shadow:0 0 25px #31c8ff44;font-size:12px;display:none}
</style></head><body><div id="wrap"><canvas id="game"></canvas><div id="hud"><div class="pill"><small>ENERGY</small><span id="energy">0</span></div><div class="pill"><small>DISTANCE</small><span id="distance">0</span> m</div><div class="pill"><small>BEST RUN</small><span id="best">0</span></div></div><button id="jump">JUMP ⚡</button><div class="overlay" id="overlay"><div class="panel"><div class="eyebrow">SOLAR HARBOUR PRESENTS</div><h1>VOLT<br><span>GUARDIAN</span></h1><div style="font-weight:900;letter-spacing:.24em;color:#f7c948;font-size:12px">POWER RUN</div><p>Protect the city. Collect clean energy. Dodge the bill monsters.<br><b>Every home needs a Volt Guardian.</b></p><button id="start">START MISSION</button><div id="hint">TAP / PRESS SPACE TO JUMP · COLLECT BLUE ORBS</div></div></div><div id="brand">SOLAR HARBOUR · RENEW OUR FUTURE</div></div>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),overlay=document.querySelector('#overlay'),start=document.querySelector('#start'),jumpBtn=document.querySelector('#jump');const energyUI=document.querySelector('#energy'),distUI=document.querySelector('#distance'),bestUI=document.querySelector('#best');let W,H,dpr,ground,last=0,running=false,distance=0,energy=0,speed=300,obstacles=[],orbs=[],spawn=1,orbSpawn=.7,particles=[];let best=0;try{best=+(localStorage.vgBest||0)}catch(e){}bestUI.textContent=best;const hero={x:80,y:0,w:42,h:62,vy:0,onGround:true};function resize(){const r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);ground=H*.79;hero.x=Math.max(38,W*.15);if(hero.onGround)hero.y=ground-hero.h}window.addEventListener('resize',resize);resize();function reset(){distance=energy=0;speed=300;obstacles=[];orbs=[];particles=[];spawn=.9;orbSpawn=.5;hero.vy=0;hero.onGround=true;hero.y=ground-hero.h;energyUI.textContent=distUI.textContent='0';last=performance.now();running=true;overlay.classList.add('hidden');jumpBtn.style.display='block';requestAnimationFrame(loop)}function jump(){if(running&&hero.onGround){hero.vy=-Math.max(570,H*.9);hero.onGround=false;burst(hero.x+20,hero.y+hero.h,7,'#31c8ff')}}function burst(px,py,n,col){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*220,vy:(Math.random()-.7)*200,life:.35+Math.random()*.4,col,r:2+Math.random()*3})}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function background(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071426');g.addColorStop(.7,'#12375a');g.addColorStop(1,'#1a4562');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<Math.ceil(W/48)+2;i++){let bx=i*54-(distance*1.5%54),bh=45+(i*37%100);x.fillStyle=i%2?'#102b48':'#0d2340';x.fillRect(bx,ground-bh-12,38,bh);x.fillStyle='#39caff55';for(let yy=ground-bh+6;yy<ground-18;yy+=14)for(let xx=bx+7;xx<bx+31;xx+=12)x.fillRect(xx,yy,4,5)}x.fillStyle='#071321';x.fillRect(0,ground,W,H-ground);x.fillStyle='#31c8ff';x.fillRect(0,ground,W,3);for(let i=0;i<W/80+2;i++){x.fillStyle='#f7c948';x.fillRect(i*90-(distance*3%90),ground+36,32,3)}}function drawHero(){let a=hero.x,b=hero.y;x.save();x.fillStyle='#b38a21';x.beginPath();x.moveTo(a+8,b+16);x.lineTo(a-9,b+43);x.lineTo(a+12,b+49);x.closePath();x.fill();x.fillStyle='#dbe8f2';x.fillRect(a+9,b+43,10,18);x.fillRect(a+25,b+43,10,18);x.fillStyle='#f7c948';x.fillRect(a+6,b+57,15,5);x.fillRect(a+23,b+57,15,5);x.fillStyle='#102f53';x.strokeStyle='#31c8ff';x.lineWidth=2;x.beginPath();x.moveTo(a+10,b+15);x.lineTo(a+33,b+15);x.lineTo(a+39,b+42);x.lineTo(a+6,b+42);x.closePath();x.fill();x.stroke();x.fillStyle='#f7c948';x.beginPath();x.moveTo(a+23,b+20);x.lineTo(a+16,b+30);x.lineTo(a+23,b+30);x.lineTo(a+19,b+38);x.lineTo(a+30,b+26);x.lineTo(a+23,b+26);x.closePath();x.fill();x.fillStyle='#dbe8f2';x.fillRect(a+1,b+20,8,21);x.fillRect(a+34,b+20,8,21);x.fillStyle='#f7c948';x.fillRect(a,b+37,10,5);x.fillRect(a+34,b+37,10,5);x.fillStyle='#dbe8f2';x.beginPath();x.roundRect(a+12,b,20,18,6);x.fill();x.fillStyle='#071426';x.fillRect(a+13,b+6,18,5);x.fillStyle='#31c8ff';x.fillRect(a+15,b+7,5,2);x.fillRect(a+24,b+7,5,2);x.restore()}function drawMonster(o){x.save();x.translate(o.x,o.y);x.fillStyle='#ed654d';x.strokeStyle='#ffc15b';x.lineWidth=2;x.beginPath();x.roundRect(0,0,o.w,o.h,8);x.fill();x.stroke();x.fillStyle='#fff3d4';x.font='bold 10px system-ui';x.textAlign='center';x.fillText('BILL',o.w/2,13);x.fillText('$$$',o.w/2,25);x.fillStyle='#451c2b';x.fillRect(7,32,5,4);x.fillRect(o.w-12,32,5,4);x.restore()}function drawOrb(o){x.save();x.shadowColor='#31c8ff';x.shadowBlur=18;x.fillStyle='#b9f2ff';x.beginPath();x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fill();x.fillStyle='#31c8ff';x.beginPath();x.arc(o.x,o.y,o.r*.55,0,Math.PI*2);x.fill();x.restore()}function gameOver(){running=false;jumpBtn.style.display='none';let d=Math.floor(distance);if(d>best){best=d;bestUI.textContent=best;try{localStorage.vgBest=best}catch(e){}}overlay.innerHTML=`<div class="panel"><div class="eyebrow">MISSION REPORT</div><h1>RUN <span>COMPLETE</span></h1><p>You collected <b style="color:#31c8ff">${energy}</b> energy orbs and travelled <b>${d} m</b>.<br>${d>=best?'New best run!':'The city still needs you.'}</p><button id="again">RUN AGAIN</button><div id="hint">JUMP OVER BILL MONSTERS AND COLLECT BLUE ORBS</div></div>`;overlay.classList.remove('hidden');document.querySelector('#again').onclick=reset}function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.035);last=now;speed=Math.min(520,speed+dt*4);distance+=dt*speed/12;background();spawn-=dt;if(spawn<=0){let h=38+Math.random()*18,w=32+Math.random()*12;obstacles.push({x:W+20,y:ground-h,w,h});spawn=Math.max(.62,1.25-Math.random()*.35-distance/900)}orbSpawn-=dt;if(orbSpawn<=0){let n=3+Math.floor(Math.random()*3);for(let i=0;i<n;i++)orbs.push({x:W+30+i*31,y:ground-100-Math.sin(i/Math.max(1,n-1)*Math.PI)*28,r:9});orbSpawn=1.2+Math.random()*1.1}hero.vy+=1500*dt;hero.y+=hero.vy*dt;if(hero.y+hero.h>=ground){hero.y=ground-hero.h;hero.vy=0;hero.onGround=true}else hero.onGround=false;obstacles.forEach(o=>o.x-=speed*dt);orbs.forEach(o=>o.x-=speed*dt);for(let o of obstacles){if(hit({x:hero.x+6,y:hero.y+5,w:hero.w-12,h:hero.h-7},o)){burst(hero.x+20,hero.y+25,18,'#f7c948');gameOver();return}}orbs=orbs.filter(o=>{if(Math.hypot(hero.x+hero.w/2-o.x,hero.y+hero.h/2-o.y)<o.r+25){energy++;energyUI.textContent=energy;burst(o.x,o.y,5,'#31c8ff');return false}return o.x>-30});obstacles=obstacles.filter(o=>o.x+o.w>-30);particles=particles.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=360*dt;p.life-=dt;x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.col;x.fillRect(p.x,p.y,p.r,p.r);x.globalAlpha=1;return p.life>0});drawHero();obstacles.forEach(drawMonster);orbs.forEach(drawOrb);distUI.textContent=Math.floor(distance);requestAnimationFrame(loop)}start.onclick=reset;c.addEventListener('pointerdown',()=>{if(running)jump()});jumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();jump()});window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(running)jump();else if(!running&&overlay.classList.contains('hidden')===false)reset()}});})();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.log('Offline support unavailable:', err))); }
</script></body></html>
